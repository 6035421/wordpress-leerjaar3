services:

  web:
    build: .
    container_name: prod_cgi_web
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: prod_cgi_db
      WORDPRESS_DB_USER: codex
      WORDPRESS_DB_PASSWORD: root
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: prod_cgi_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prod_cgi_db
      MYSQL_USER: codex
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: prod_cgi_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: codex
      PMA_PASSWORD: root
    ports:
      - "8091:80"
    depends_on:
      - db

volumes:
  db_data: